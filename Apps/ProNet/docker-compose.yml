version: '3.8'

services:
  backend:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./src/backend/uploads:/app/uploads
      - ./src/backend/pronet.db:/app/pronet.db
    environment:
      - PRONET_HOST=0.0.0.0
      - PRONET_PORT=8000
      - PRONET_CLIENT_ORIGIN=http://localhost:5173

  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - backend
